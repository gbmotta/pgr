# Nixpacks detecta Python automaticamente pelo requirements.txt
# Nixpacks instala pip e dependências Python automaticamente
# Só precisamos especificar Node.js para o React

[phases.setup]
nixPkgs = ['nodejs-18_x']

# Build do frontend React
# Python e suas dependências são instalados automaticamente pelo Nixpacks
[phases.build]
cmds = [
  "cd frontend-react && npm install && npm run build"
]

