# Nixpacks configuração para Python + Node.js

[phases.setup]
nixPkgs = ['nodejs-18_x', 'python311']

# Instalar dependências Python explicitamente
[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt"
]

# Build do frontend React
[phases.build]
cmds = [
  "cd frontend-react && npm install && npm run build"
]

