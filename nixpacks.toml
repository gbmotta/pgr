# Nixpacks detecta Python automaticamente pelo requirements.txt
# Precisamos Node.js para o React e garantir Python

[phases.setup]
nixPkgs = ['nodejs-18_x', 'python311']

# Nixpacks instala dependências Python automaticamente via requirements.txt
# Mas vamos garantir no build.sh também
[phases.build]
cmds = ["./build.sh"]

