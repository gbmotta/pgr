# Nixpacks detecta Python automaticamente pelo requirements.txt
# Nixpacks instala dependências Python automaticamente quando detecta requirements.txt
# Só precisamos especificar Node.js para o React

[phases.setup]
nixPkgs = ['nodejs-18_x']

# Build do frontend React
# Nixpacks instala Python deps automaticamente via requirements.txt
[phases.build]
cmds = [
  "cd frontend-react && npm install && npm run build"
]

