# Nixpacks detecta Python automaticamente pelo requirements.txt
# Nixpacks instala dependências Python automaticamente

[phases.setup]
nixPkgs = ['nodejs-18_x']

# Fase de instalação - Nixpacks já instala Python deps via requirements.txt
# Aqui só precisamos do frontend React
[phases.install]
cmds = [
  "cd frontend-react && npm ci"
]

# Fase de build - build do React
[phases.build]
cmds = [
  "cd frontend-react && npm run build"
]

