# Nixpacks configuração para Python + Node.js
# Garantir que Python e pip são instalados

[phases.setup]
nixPkgs = ['nodejs-18_x', 'python311', 'pip']

# Instalar dependências Python primeiro
[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]

# Build do frontend React
[phases.build]
cmds = [
  "cd frontend-react && npm install && npm run build"
]

