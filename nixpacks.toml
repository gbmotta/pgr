# Nixpacks configuração para Python + Node.js
# Garantir que Python é instalado

[phases.setup]
nixPkgs = ['nodejs-18_x', 'python311']

# Instalar dependências Python usando python3 -m pip
[phases.install]
cmds = [
  "python3 -m ensurepip --upgrade || true",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt"
]

# Build do frontend React
[phases.build]
cmds = [
  "cd frontend-react && npm install && npm run build"
]

