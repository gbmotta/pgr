# Nixpacks detecta Python automaticamente pelo requirements.txt
# Garantir que Python e dependências estão instalados

[phases.setup]
nixPkgs = ['nodejs-18_x', 'python311']

# Instalar dependências Python
[phases.install]
cmds = [
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt"
]

# Fase de build - builda React
[phases.build]
cmds = [
  "cd frontend-react && npm install && npm run build"
]

